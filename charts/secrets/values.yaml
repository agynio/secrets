replicaCount: 1

image:
  repository: ghcr.io/agynio/secrets
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: "secrets"

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 50051

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

database:
  # Plaintext database URL. Leave empty when using an existing secret.
  url: ""
  existingSecret:
    # Secret containing the database URL. Leave empty when using `database.url`.
    name: agyn-platform-database-urls
    # Key within the secret that stores the connection string.
    key: secrets

secrets:
  encryptionKeyFile: "/etc/secrets-encryption/encryptionKey"
  encryptionKeySecretName: "secrets-encryption-key"

# Deleting a secret is refused while an EgressRule, a Subscription, or an Image
# holds it by reference, so the service asks each of them first. It defaults to
# each peer's name in its own namespace, which is where they are: set these only
# to point somewhere else.
egressRules:
  grpcTarget: ""
llm:
  grpcTarget: ""
images:
  grpcTarget: ""

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
