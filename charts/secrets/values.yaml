replicaCount: 1

image:
  repository: ghcr.io/agynio/secrets
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: "secrets"

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 50051

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

database:
  # Plaintext database URL. Leave empty when using an existing secret.
  url: ""
  existingSecret:
    # Secret containing the database URL. Leave empty when using `database.url`.
    name: agyn-platform-database-urls
    # Key within the secret that stores the connection string.
    key: secrets

secrets:
  encryptionKeyFile: "/etc/secrets-encryption/encryptionKey"
  encryptionKeySecretName: "secrets-encryption-key"

egressRules:
  grpcTarget: ""

# Secret deletion is refused when a Subscription holds the secret by reference,
# so this must point at the LLM service or deletes fail closed.
llm:
  grpcTarget: ""

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
