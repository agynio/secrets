version: v2beta1

vars:
  SECRETS_NAMESPACE: platform

functions:
  patch_deployment: |-
    echo "Patching secrets deployment for DevSpace..."
    # Resolve by label rather than by name: the umbrella release and the
    # bootstrap stack name the deployment differently, and a hardcoded name
    # works in one and aborts the pipeline in the other.
    SECRETS_DEPLOYMENT="$(kubectl get deployment -n ${SECRETS_NAMESPACE} \
      -l app.kubernetes.io/name=secrets -o jsonpath='{.items[0].metadata.name}')"
    if [ -z "${SECRETS_DEPLOYMENT}" ]; then
      echo "ERROR: no deployment with app.kubernetes.io/name=secrets in ${SECRETS_NAMESPACE}" >&2
      exit 1
    fi
    echo "  target deployment: ${SECRETS_DEPLOYMENT}"
    kubectl patch deployment "${SECRETS_DEPLOYMENT}" -n ${SECRETS_NAMESPACE} --type strategic --patch "$(cat <<'EOF'
    spec:
      template:
        spec:
          securityContext:
            runAsUser: 1000
            fsGroup: 1000
          initContainers: []
          volumes:
            - name: data
              emptyDir: {}
          containers:
            - name: secrets
              image: ghcr.io/agynio/devcontainer-go:1 # dev container for source deploy
              workingDir: /opt/app/data
              # The container has no source until DevSpace syncs it, and DevSpace
              # syncs only once the pod reports Ready. A probe on the app port
              # makes that circular, and liveness would kill the container
              # mid-compile. The pipeline's health check is what confirms the
              # service is serving before the session exits.
              livenessProbe: null
              readinessProbe: null
              startupProbe: null
              command:
                - sh
                - -c
                - |
                  set -eu
                  elapsed=0
                  while [ ! -f /opt/app/data/go.mod ]; do
                    sleep 1; elapsed=$((elapsed + 1))
                    [ "$elapsed" -ge 900 ] && { echo "ERROR: sync timeout" >&2; exit 1; }
                  done
                  buf generate buf.build/agynio/api \
                    --path agynio/api/secrets/v1 \
                    --path agynio/api/egress/v1 \
                    --path agynio/api/llm/v1
                  exec go run ./cmd/secrets
              volumeMounts:
                - name: data
                  mountPath: /opt/app/data
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                readOnlyRootFilesystem: false
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
    EOF
    )"

pipelines:
  dev:
    flags:
      - name: watch
        short: w
        description: "Keep DevSpace running and stream logs"
    run: |-
      patch_deployment
      if [ "$(get_flag "watch")" == "true" ]; then
        start_dev --disable-pod-replace secrets
      else
        start_dev --disable-pod-replace secrets
        echo "Waiting for secrets to be healthy on :50051..."
        ELAPSED=0
        until kubectl logs -n ${SECRETS_NAMESPACE} -l app.kubernetes.io/name=secrets --tail=200 2>/dev/null | \
          grep -q "SecretsService listening"; do
          sleep 5
          ELAPSED=$((ELAPSED + 5))
          if [ "$ELAPSED" -ge 900 ]; then
            kubectl get pods -n ${SECRETS_NAMESPACE} -l app.kubernetes.io/name=secrets -o wide >&2
            kubectl logs -n ${SECRETS_NAMESPACE} -l app.kubernetes.io/name=secrets --tail=200 >&2
            echo "ERROR: secrets did not become healthy within 900s" >&2
            exit 1
          fi
        done
        echo "Secrets is running from source."
        stop_dev secrets
      fi

dev:
  secrets:
    namespace: ${SECRETS_NAMESPACE}
    labelSelector:
      # Name only: the release name differs between the umbrella (agyn-platform)
      # and the bootstrap stack, so pinning the instance label matches in one
      # environment and finds nothing in the other.
      app.kubernetes.io/name: secrets
    containers:
      secrets:
        container: secrets
        sync:
          - path: ./:/opt/app/data
            excludePaths:
              - .git/
              - .devspace/
              - /gen/
              - /tmp/
            uploadExcludePaths:
              - .git/
              - .devspace/
              - /gen/
              - /tmp/
            downloadExcludePaths:
              - .git/
              - .devspace/
              - /gen/
              - /tmp/
        logs:
          enabled: true
          lastLines: 200
